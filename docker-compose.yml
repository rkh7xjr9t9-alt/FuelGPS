version: "3.9"

services:
  # ── PostgreSQL database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fueldgps}
      POSTGRES_USER: ${POSTGRES_USER:-fuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuel} -d ${POSTGRES_DB:-fueldgps}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Node.js Application ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-fuel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fueldgps}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FETCH_OSM: ${FETCH_OSM:-true}
      SEED_DB: ${SEED_DB:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - external

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro      # optional TLS certs
    depends_on:
      - app
    networks:
      - external

volumes:
  pgdata:

networks:
  internal:
  external:
